name: Cập nhật video YouTube
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/update_videos.py, .github/workflows/videos.yml]
permissions:
  contents: write
concurrency:
  group: videos
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_videos.py
      - name: Commit nếu có video mới
        run: |
          if git diff --quiet -- videos.json; then echo "Không có gì mới"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git commit -m "Cập nhật danh sách video"
          git push
