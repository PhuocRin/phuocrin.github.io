name: Cập nhật firmware iOS
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/update_firmware.py, .github/workflows/firmware.yml]
permissions:
  contents: write
  issues: write
  actions: read
concurrency:
  group: firmware
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lấy bộ nhớ đệm
        uses: actions/cache@v4
        with:
          path: .cache
          key: firmware-${{ github.run_id }}
          restore-keys: firmware-
      - run: python scripts/update_firmware.py
      - name: Commit nếu trạng thái đổi
        run: |
          git add -A firmware
          if git diff --cached --quiet; then echo "Không có gì mới"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Cập nhật firmware iOS"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
      - name: Báo khi Apple khoá hoặc ký bản
        if: hashFiles('.cache/alert.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="$(head -n 1 .cache/alert.md)"
          tail -n +2 .cache/alert.md > /tmp/body.md
          gh issue create --repo "${{ github.repository }}" --title "$title" --body-file /tmp/body.md
      - name: Canh bot video (mở issue nếu quá 13 giờ chưa chạy)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/canh_bao_bot.sh canh videos.yml 13 "video" || true
      - name: Báo bot firmware lỗi
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/canh_bao_bot.sh loi "firmware"
      - name: Đóng báo lỗi khi bot firmware chạy lại được
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/canh_bao_bot.sh on "firmware" || true
